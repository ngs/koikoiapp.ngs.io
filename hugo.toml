baseURL = 'https://koikoiapp.ngs.io/'
title = 'Koikoi'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
[languages.en]
contentDir = "content/en"
languageCode = "en"
languageName = "English"
weight = 1
[languages.ja]
contentDir = "content/ja"
languageCode = "ja"
languageName = "日本語"
weight = 2
[languages.ja.params]
description = '花札の定番「こいこい」を iPhone / iPad / Mac / Apple Vision Pro で。定番ルール・4 段階の AI・美しい札。'

[params]
description = 'Koi-Koi, the classic hanafuda card game, for iPhone, iPad, Mac and Apple Vision Pro. Standard rules, four AI levels, beautifully drawn cards.'
appStoreURL = 'https://apps.apple.com/app/koikoi-japanese-card-game/id6797163218'
supportURL = 'https://github.com/ngs/koikoi-swift/issues'
contactEmail = 'corp@littleapps.co.jp'
ogImage = '/img/og.png'
# Languages that have their own screenshots; every other language falls back to en.
screenshotLanguages = ['en', 'ja']

# Tags and categories are unused, so disable them with an empty taxonomy table.
[taxonomies]

[permalinks]
[permalinks.page]
privacy = "/privacy/"
